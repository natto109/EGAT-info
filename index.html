<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EGAT Touchscreen</title>
<style>
  :root{
    --egat-yellow:#ffc20e;
    --egat-blue:#0b4ea2;
    --glow:120,180,255;           /* สีแสงเรืองของปุ่ม (R,G,B) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  body{
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    touch-action:none;-webkit-tap-highlight-color:transparent;
    font-family:"Gotham","Montserrat","Segoe UI",system-ui,sans-serif;
  }
  img{display:block;-webkit-user-drag:none;user-drag:none;pointer-events:none}

  /* ---------- 1920x1080 stage scaled to fit ---------- */
  #stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:0 0;overflow:hidden;background:#000;
  }
  .abs{position:absolute}
  .screen{position:absolute;inset:0;visibility:hidden}
  .screen.active{visibility:visible}

  /* ---------- HOME : background ---------- */
  #home .bg{left:0;top:0;width:1920px;height:1080px;opacity:0}
  #home .earth-glow{left:0;top:0;width:1920px;height:1080px;mix-blend-mode:screen;opacity:0}
  #home.play .bg{animation:fadeIn 1s ease-out forwards}
  #home.play .earth-glow{animation:fadeIn 1.2s ease-out .4s forwards, earthPulse 6s ease-in-out 1.6s infinite}
  @keyframes earthPulse{
    0%,100%{opacity:.2}
    50%{opacity:.8}
  }

  /* ---------- satellite: drift left → right, loop ---------- */
  .sat-track{left:0;top:269px;width:307px;height:232px;will-change:transform;
    animation:satMove var(--sat-dur,90s) linear var(--sat-delay,0s) infinite}
  .sat-bob{width:100%;height:100%;animation:satBob 9s ease-in-out infinite}
  @keyframes satMove{
    from{transform:translateX(-340px)}
    to  {transform:translateX(1960px)}
  }
  @keyframes satBob{
    0%,100%{transform:translateY(0) rotate(0deg)}
    50%    {transform:translateY(14px) rotate(-2.5deg)}
  }

  /* ---------- text lines: animate in one by one ---------- */
  .line-in{opacity:0;transform:translateY(24px)}
  #home.play .line-in{animation:lineIn .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d)}
  @keyframes lineIn{to{opacity:1;transform:none}}
  .rule{opacity:0;transform:scaleX(0);transform-origin:50% 50%}
  #home.play .rule{animation:ruleIn .9s cubic-bezier(.6,0,.2,1) forwards;animation-delay:var(--d)}
  @keyframes ruleIn{0%{opacity:1;transform:scaleX(0)}100%{opacity:1;transform:scaleX(1)}}
  @keyframes fadeIn{to{opacity:1}}

  /* ---------- menu buttons ---------- */
  /* ---------- text glow: soft flicker behind each line ---------- */
  .tglow{opacity:0;filter:blur(7px) brightness(1.8);mix-blend-mode:screen}
  #home.glowing .tglow{animation:flicker var(--fd) linear infinite;animation-delay:var(--fdl)}
  @keyframes flicker{
    0%{opacity:.45} 6%{opacity:.75} 8%{opacity:.4} 14%{opacity:.65} 27%{opacity:.55}
    29%{opacity:.9} 31%{opacity:.5} 45%{opacity:.7} 58%{opacity:.45} 60%{opacity:.8}
    62%{opacity:.55} 76%{opacity:.7} 88%{opacity:.5} 90%{opacity:.85} 92%{opacity:.6} 100%{opacity:.45}
  }
  /* ---------- logo light sweep (drawn on canvas) ---------- */
  #logoSweep{left:833px;top:65px;width:246px;height:70px;pointer-events:none;
    filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 16px rgba(255,214,120,.6))}
  /* ---------- satellite thruster ---------- */
  #thruster{position:absolute;left:-178px;top:127px;width:320px;height:320px;pointer-events:none;mix-blend-mode:screen}

  .btn{width:268px;height:268px;border-radius:50%;cursor:pointer;opacity:0;transform:scale(.85)}
  #home.play .btn{animation:btnIn .7s cubic-bezier(.2,.8,.25,1.15) forwards;animation-delay:var(--d)}
  @keyframes btnIn{to{opacity:1;transform:scale(1)}}
  .btn .face{position:absolute;inset:0;transition:transform .15s ease-out}
  .btn .circle{position:absolute;left:0;top:0;width:268px;height:268px;opacity:.75}
  .btn .lbl{position:absolute}
  .btn .halo{
    position:absolute;inset:0;border-radius:50%;opacity:0;pointer-events:none;
    border:2px solid rgba(var(--glow),.75);
    box-shadow:0 0 40px 8px rgba(var(--glow),.6), inset 0 0 44px 6px rgba(var(--glow),.4);
  }
  /* sequential soft glow, left → right */
  #home.glowing .btn .halo{animation:halo var(--cycle) ease-in-out infinite;animation-delay:var(--gd)}
  @keyframes halo{
    0%   {opacity:0}
    7%   {opacity:1}
    20%  {opacity:0}
    100% {opacity:0}
  }
  .btn.pressed .face{transform:scale(.93)}
  .btn.pressed .halo{animation:none!important;opacity:1}

  /* =========================================================
     CONTENT PAGES (shared layout)
     ========================================================= */
  .cpage .frame{left:0;top:0;width:1920px;height:1080px;opacity:0}
  .cpage .homeBtn{left:1780px;top:58px;width:86px;height:86px;border-radius:50%;cursor:pointer;opacity:0}
  .cpage .homeBtn img{width:86px;height:auto;transition:transform .15s}
  .cpage .homeBtn.pressed img{transform:scale(.9)}
  .cpage .cat{opacity:0;transform:translateX(-40px)}
  .cpage .card{left:21px;top:-1px;width:1877px;height:1056px;overflow:hidden;opacity:0;transform:translateY(40px)}
  .cpage .kb{position:absolute;inset:0;will-change:transform}
  .cpage .kb > *{position:absolute}

  /* step 1: frame + home button   step 2: category label   step 3: card + text lines */
  .cpage.play .frame,
  .cpage.play .homeBtn{animation:fadeIn .7s ease-out forwards}
  .cpage.play .cat{animation:catIn .8s cubic-bezier(.2,.7,.2,1) .55s forwards}
  .cpage.play .card{animation:cardIn 1.1s cubic-bezier(.2,.7,.2,1) 1.05s forwards}
  .cpage.play .line-in{animation:lineIn .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d)}
  .cpage.play .rule{animation:ruleIn .9s cubic-bezier(.6,0,.2,1) forwards;animation-delay:var(--d)}
  @keyframes catIn{to{opacity:1;transform:none}}
  @keyframes cardIn{to{opacity:1;transform:none}}

  /* ---------- city ambience ---------- */
  /* 1) water ripple (canvas, row displacement inside a water mask) */
  .ripple{pointer-events:none}
  /* 2) sun: breathing glow + slowly turning rays */
  .sun-rays{width:900px;height:900px;mix-blend-mode:screen;opacity:0}
  .sun-glow{width:520px;height:520px;mix-blend-mode:screen;opacity:0}
  .cpage.live .sun-rays{animation:raysSpin 140s linear infinite, raysPulse 7s ease-in-out infinite}
  .cpage.live .sun-glow{animation:sunPulse 5s ease-in-out infinite}
  @keyframes raysSpin{to{rotate:360deg}}
  @keyframes raysPulse{0%,100%{opacity:.35}50%{opacity:.75}}
  @keyframes sunPulse{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:.9;transform:scale(1.08)}}
  /* 3) sunlight glare sweeping over water, panels and glass (drawn on canvas) */
  .glare{left:0;top:0;width:1877px;height:1056px;mix-blend-mode:screen;pointer-events:none}
  /* yellow tagline bar: wipes in from the left, then its text */
  .tag-bar{clip-path:inset(0 100% 0 0 round 42px)}
  .tag-text{opacity:0;transform:translateX(-24px)}
  .cpage.play .tag-bar{animation:barWipe .9s cubic-bezier(.6,0,.2,1) forwards;animation-delay:var(--d)}
  .cpage.play .tag-text{animation:catIn .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d)}
  @keyframes barWipe{to{clip-path:inset(0 0 0 0 round 42px)}}
  .falls,.turbines,.chargers,.fx,.mist{pointer-events:none}
  .fx{mix-blend-mode:screen}
  .obj-sweep{pointer-events:none;filter:drop-shadow(0 0 4px rgba(255,255,255,.95)) drop-shadow(0 0 12px rgba(255,220,120,.7))}
  /* category label light sweep */
  .cat-sweep{pointer-events:none;
    filter:drop-shadow(0 0 5px rgba(255,255,255,.9)) drop-shadow(0 0 14px rgba(255,214,120,.6))}

  /* ---------- staff panels (EventLab olive gold) ---------- */
  .admin{
    --a-bg:#1e1d19; --a-surface:#2a2924; --a-line:#3b3a33; --a-olive:#7b8040; --a-olive-hi:#979c52;
    --a-gold:#c9a646; --a-text:#ece8dc; --a-muted:#a7a391;
    position:absolute;inset:0;background:rgba(10,10,8,.72);display:flex;align-items:center;justify-content:center;
    font-family:"Sarabun","Segoe UI","Leelawadee UI",Tahoma,sans-serif;color:var(--a-text);
  }
  .admin[hidden]{display:none}
  .admin-panel{width:980px;background:var(--a-bg);border:1px solid var(--a-line);border-radius:20px;padding:44px 52px 40px;display:flex;flex-direction:column;gap:14px}
  .admin-panel.small{width:760px}
  .admin-head{display:flex;gap:22px;align-items:center;margin-bottom:8px}
  .admin .mono{width:64px;height:64px;border-radius:14px;border:2px solid var(--a-gold);color:var(--a-gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;letter-spacing:1px}
  .admin h2{font-size:40px;font-weight:700;line-height:1.1}
  .admin h3{font-size:22px;color:var(--a-gold);font-weight:600;letter-spacing:.5px;margin-top:14px;padding-bottom:6px;border-bottom:1px solid var(--a-line)}
  .admin p{font-size:20px;color:var(--a-muted)}
  .admin .row{display:grid;grid-template-columns:330px 64px 1fr 64px 80px;gap:16px;align-items:center;min-height:72px}
  .admin .row label{font-size:24px}
  .admin .row .num{grid-column:3;font-size:24px;text-align:center}
  .admin .row .num b{font-size:34px;color:var(--a-gold);font-variant-numeric:tabular-nums;margin-right:6px}
  .admin output{font-size:28px;font-weight:700;color:var(--a-gold);text-align:right;font-variant-numeric:tabular-nums}
  .admin button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--a-line);background:var(--a-surface);color:var(--a-text)}
  .admin .step{width:64px;height:64px;font-size:34px;line-height:1}
  .admin .step:active,.admin .ghost:active{background:var(--a-line)}
  .admin input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:64px;background:transparent;touch-action:none}
  .admin input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:var(--a-line)}
  .admin input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:var(--a-gold);margin-top:-17px;border:4px solid var(--a-bg)}
  .admin .status{font-size:20px;padding:12px 18px;border-radius:10px;background:var(--a-surface);border-left:4px solid var(--a-muted)}
  .admin .status[data-ok="1"]{border-left-color:var(--a-olive-hi);color:var(--a-text)}
  .admin .status[data-ok="0"]{border-left-color:var(--a-gold)}
  .admin-foot{display:flex;justify-content:flex-end;gap:16px;margin-top:22px}
  .admin .ghost,.admin .primary{height:72px;padding:0 36px;font-size:24px;font-weight:600}
  .admin .primary{background:var(--a-olive);border-color:var(--a-olive);color:#fff}
  .admin .primary:active{background:var(--a-olive-hi)}

  /* ---------- page transition cover ---------- */
  #fader{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s ease}
  #fader.on{opacity:1;pointer-events:auto}

  /* ---------- temporary placeholder for content pages ---------- */
  #page .ph-label{left:30px;top:34px;color:var(--egat-yellow);font-weight:800;font-size:40px;line-height:1.12;text-transform:uppercase;letter-spacing:.5px}
  #page .ph-card{left:28px;top:32px;width:1864px;height:1016px;background:#fff;border-radius:40px;
    clip-path:polygon(330px 0,100% 0,100% 100%,0 100%,0 330px)}
  #page .ph-note{left:390px;top:120px;color:var(--egat-blue);font-weight:800;font-size:64px;line-height:1.1}
  #page .ph-sub{left:392px;top:220px;color:#5a6b85;font-size:30px}
  .home-btn{left:1780px;top:58px;width:86px;height:86px;border-radius:50%;background:var(--egat-yellow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .home-btn.pressed{transform:scale(.9)}
  .home-btn svg{width:46px;height:46px}
</style>
</head>
<body>
<div id="stage">

  <!-- =================== HOME =================== -->
  <section id="home" class="screen">
    <img class="abs bg" src="assets/bg.jpg" alt="">
    <img class="abs earth-glow" src="assets/earth-glow.jpg" alt="">

    <div class="abs sat-track"><div class="sat-bob">
      <img src="assets/satellite.png" width="307" height="232" alt="">
      <canvas id="thruster" width="320" height="320"></canvas>
    </div></div>

    <!-- text glow layers (behind the text) -->
    <img class="abs tglow" style="left:343px;top:182px;width:1227px;--fd:4.3s;--fdl:0s"   src="assets/text1.png" alt="">
    <img class="abs tglow" style="left:517px;top:240px;width:878px;--fd:3.7s;--fdl:-1.2s" src="assets/text2.png" alt="">
    <img class="abs tglow" style="left:529px;top:341px;width:855px;--fd:5.1s;--fdl:-2.6s" src="assets/text3.png" alt="">

    <!-- text lines, in reading order -->
    <img class="abs line-in" id="logoImg" style="left:833px;top:65px;width:246px;--d:.35s"  src="assets/logo.png"  alt="EGAT">
    <canvas class="abs" id="logoSweep" width="492" height="140"></canvas>
    <img class="abs line-in" style="left:343px;top:182px;width:1227px;--d:.75s" src="assets/text1.png" alt="Powering Thailand's Sustainable Future">
    <img class="abs line-in" style="left:517px;top:240px;width:878px;--d:1.05s" src="assets/text2.png" alt="Through Energy Innovation and Space Technology">
    <img class="abs rule"    style="left:524px;top:301px;width:865px;--d:1.35s" src="assets/line.png"  alt="">
    <img class="abs line-in" style="left:529px;top:341px;width:855px;--d:1.6s"  src="assets/text3.png" alt="Reliable Energy Today, Sustainable Tomorrow">

    <div id="menu"></div>
  </section>

  <!-- =================== PAGE: WHO WE ARE =================== -->
  <section id="pg-who" class="screen cpage">
    <img class="abs frame" src="assets/who/frame.jpg" alt="">
    <div class="abs card" style="clip-path:polygon(384px 33px,370px 35px,357px 39px,349px 43px,335px 53px,41px 347px,26px 367px,16px 387px,10px 407px,10px 411px,8px 419px,8px 427px,7px 429px,7px 1015px,9px 1025px,16px 1037px,23px 1043px,36px 1048px,36px 1049px,1843px 1049px,1843px 1048px,1856px 1043px,1861px 1039px,1866px 1033px,1870px 1025px,1872px 1015px,1872px 73px,1871px 71px,1871px 65px,1869px 61px,1869px 59px,1863px 49px,1852px 39px,1843px 35px,1833px 33px)">
      <div class="kb">
        <img class="city-src" src="assets/who/city.jpg" style="left:0;top:0;width:1877px;height:1056px" alt="">
        <canvas class="ripple" width="750" height="314" style="left:556px;top:684px;width:750px;height:314px"
                data-x="556" data-y="684" data-mask="assets/who/water-mask.png"></canvas>
        <img class="sun-rays" src="assets/who/sun-rays.jpg" style="left:14px;top:106px" alt="">
        <img class="sun-glow" src="assets/who/sun-glow.jpg" style="left:204px;top:296px" alt="">
        <canvas class="glare" width="938" height="528" data-hi="assets/who/city-hi.jpg"></canvas>
      </div>
    </div>
    <img class="abs cat" src="assets/who/label.png" style="left:84px;top:37px;width:101px" alt="Who We Are">
    <canvas class="abs cat-sweep" width="202" height="236" style="left:84px;top:37px;width:101px;height:118px"></canvas>
    <img class="abs line-in" src="assets/who/title.png"    style="left:390px;top:91px;width:507px;--d:1.55s" alt="EGAT Mission">
    <img class="abs rule"    src="assets/who/rule-top.png" style="left:384px;top:165px;width:1055px;--d:1.8s" alt="">
    <img class="abs line-in" src="assets/who/p1.png"       style="left:386px;top:194px;width:1054px;--d:2.0s" alt="To provide secure, reliable, and affordable electricity while creating">
    <img class="abs line-in" src="assets/who/p2.png"       style="left:386px;top:229px;width:1054px;--d:2.2s" alt="a sustainable energy future for Thailand, enhancing quality of life">
    <img class="abs line-in" src="assets/who/p3.png"       style="left:386px;top:265px;width:1054px;--d:2.4s" alt="and supporting national and global climate goals.">
    <img class="abs rule"    src="assets/who/rule-bot.png" style="left:384px;top:318px;width:1055px;--d:2.65s" alt="">
    <div class="abs homeBtn" data-home style="left:1780px;top:58px"><img src="assets/who/home.png" alt="Home"></div>
  </section>

  <!-- =================== PAGE: GROWTH & INVESTMENT =================== -->
  <section id="pg-growth" class="screen cpage" data-live="3900">
    <img class="abs frame" src="assets/growth/frame.jpg" alt="">
    <div class="abs card" style="left:3px;top:0;width:1914px;height:1054px;clip-path:polygon(397px 33px,386px 35px,374px 39px,366px 43px,354px 51px,58px 347px,43px 367px,34px 385px,34px 387px,31px 393px,30px 399px,28px 403px,28px 407px,26px 413px,26px 419px,25px 421px,25px 1021px,29px 1031px,38px 1041px,45px 1045px,55px 1048px,55px 1049px,1859px 1049px,1859px 1048px,1869px 1045px,1878px 1039px,1883px 1033px,1887px 1025px,1889px 1017px,1889px 69px,1887px 61px,1882px 51px,1879px 47px,1875px 43px,1866px 37px,1853px 33px)">
      <div class="kb">
        <img class="city-src" src="assets/growth/city.jpg" style="left:0;top:0;width:1914px;height:1054px" alt="">
        <canvas class="falls" width="200" height="120" style="left:120px;top:730px;width:200px;height:120px" data-mask="assets/growth/fall-mask.png"></canvas>
        <canvas class="turbines" width="940" height="320" style="left:30px;top:440px;width:470px;height:160px" data-set="growth" data-x="30" data-y="440"></canvas>
        <img class="sun-rays" src="assets/who/sun-rays.jpg" style="left:1170px;top:2px" alt="">

        <canvas class="glare" width="957" height="527" style="width:1914px;height:1054px" data-hi="assets/growth/city-hi.jpg"></canvas>
      </div>
    </div>
    <img class="abs cat" src="assets/growth/label.png" style="left:31px;top:37px;width:224px" alt="Growth & Investment">
    <canvas class="abs cat-sweep" width="448" height="216" style="left:31px;top:37px;width:224px;height:108px"></canvas>
    <img class="abs line-in" src="assets/growth/t1.png"       style="left:385px;top:92px;width:1202px;--d:1.55s" alt="Powering Thailand's Growth">
    <img class="abs line-in" src="assets/growth/t2.png"       style="left:385px;top:161px;width:1202px;--d:1.75s" alt="and Investment">
    <img class="abs rule"    src="assets/growth/rule-top.png" style="left:384px;top:241px;width:1206px;--d:2.0s" alt="">
    <img class="abs line-in" src="assets/growth/p1.png"       style="left:385px;top:271px;width:1196px;--d:2.2s" alt="Thailand's electric power potential enables large-scale investments, industrial">
    <img class="abs line-in" src="assets/growth/p2.png"       style="left:385px;top:305px;width:1196px;--d:2.4s" alt="expansion, smart cities, and future economic corridors.">
    <img class="abs rule"    src="assets/growth/rule-bot.png" style="left:384px;top:362px;width:1206px;--d:2.65s" alt="">
    <!-- yellow tagline bar: comes in last -->
    <img class="abs tag-bar"  src="assets/growth/bar.png"      style="left:62px;top:943px;width:795px;--d:3.0s" alt="">
    <img class="abs tag-text" src="assets/growth/bar-text.png" style="left:96px;top:975px;width:727px;--d:3.45s" alt="Powering opportunities for a stronger Thailand">
    <div class="abs homeBtn" data-home><img src="assets/btn-home.png" alt="Home"></div>
  </section>

  <!-- =================== PAGE: EV SOLUTIONS =================== -->
  <section id="pg-ev" class="screen cpage" data-live="3900">
    <img class="abs frame" src="assets/ev/frame.jpg" alt="">
    <div class="abs card" style="left:23px;top:1px;width:1871px;height:1052px;clip-path:polygon(383px 31px,367px 33px,350px 39px,337px 47px,330px 53px,42px 341px,30px 355px,26px 361px,23px 367px,21px 369px,12px 389px,6px 411px,6px 417px,5px 419px,5px 1019px,10px 1031px,18px 1039px,24px 1043px,33px 1046px,33px 1047px,1841px 1047px,1841px 1046px,1845px 1045px,1853px 1041px,1862px 1033px,1868px 1021px,1868px 1017px,1869px 1015px,1869px 69px,1867px 59px,1862px 49px,1857px 43px,1845px 35px,1840px 33px,1829px 31px)">
      <div class="kb">
        <img class="city-src" src="assets/ev/city.jpg" style="left:0;top:0;width:1871px;height:1052px" alt="">
        <canvas class="turbines" width="540" height="280" style="left:70px;top:310px;width:270px;height:140px" data-set="ev" data-x="70" data-y="310"></canvas>
        <canvas class="chargers" width="1620" height="150" style="left:200px;top:825px;width:810px;height:75px" data-set="ev" data-x="200" data-y="825"></canvas>
        <img class="obj-src" id="evSign" src="assets/ev/sign-mask.png" style="display:none" alt="">
        <canvas class="obj-sweep" width="312" height="244" style="left:610px;top:612px;width:156px;height:122px" data-src="evSign"></canvas>
        <canvas class="glare" width="936" height="526" style="width:1871px;height:1052px" data-hi="assets/ev/city-hi.jpg"></canvas>

const logoImg = document.getElementById('logoImg');

let sweepTimer, sweepRaf;
function sweepOnce(){
  const W = sweepCv.width, H = sweepCv.height, band = W*0.32;
  const dur = CONFIG.sweepDuration*1000, t0 = performance.now();
  cancelAnimationFrame(sweepRaf);
  (function frame(now){
    const p = Math.min(1,(now-t0)/dur);
    const e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;        // easeInOut
    const x = -band + e*(W+band*2);
    sctx.clearRect(0,0,W,H);
    sctx.globalCompositeOperation = 'source-over';
    sctx.drawImage(logoImg,0,0,W,H);
    sctx.globalCompositeOperation = 'source-in';
    const g = sctx.createLinearGradient(x-band/2,0,x+band/2,H*0.35);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(.5,'rgba(255,250,225,1)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    sctx.fillStyle = g; sctx.fillRect(0,0,W,H);
    if (p<1) sweepRaf = requestAnimationFrame(frame);
    else sctx.clearRect(0,0,W,H);
  })(t0);
}
function scheduleSweep(first){
  clearTimeout(sweepTimer);
  const wait = first ? 400 : (CONFIG.sweepMin + Math.random()*(CONFIG.sweepMax-CONFIG.sweepMin))*1000;
  sweepTimer = setTimeout(()=>{
    if (document.getElementById('home').classList.contains('active')) sweepOnce();

}

/* ---------- satellite thruster (flickering exhaust) ---------- */
const thr = document.getElementById('thruster');
const tctx = thr.getContext('2d');
const NOZZLE = {x:290, y:40};        // nozzle point inside the canvas (canvas is placed so this sits at the module's rear end)
const ANGLE = 142*Math.PI/180;       // exhaust direction: lower-left, along the module axis
let flick = 1, flickTarget = 1, puff = 0;
function drawThruster(){
  const [r,g,b] = CONFIG.thrusterColor;
  if (Math.random()<.35) flickTarget = .65 + Math.random()*.5;   // jittery target
  if (Math.random()<.03) puff = 1;                                // occasional stronger burst
  flick += (flickTarget-flick)*.35;
  puff *= .9;
  const len = CONFIG.thrusterLength*(flick + puff*.35);
  const W = thr.width, H = thr.height;
  tctx.setTransform(1,0,0,1,0,0);
  tctx.clearRect(0,0,W,H);
  tctx.globalCompositeOperation = 'lighter';
  tctx.translate(NOZZLE.x-6, NOZZLE.y+6);
  tctx.rotate(ANGLE);
  // plume: overlapping soft blobs that widen and fade along the axis
  const N = 14;
  for (let i=0;i<N;i++){
    const t = i/(N-1);
    const x = t*len + (Math.random()-.5)*3;
    const y = (Math.random()-.5)*2*t*3;
    const rad = 7 + t*20*(.9+Math.random()*.2);
    const a = Math.pow(1-t,1.6)*(.28+.12*flick);
    const gr = tctx.createRadialGradient(x,y,0,x,y,rad);
    gr.addColorStop(0,`rgba(${r},${g},${b},${a})`);
    gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
    tctx.fillStyle = gr;
    tctx.beginPath(); tctx.arc(x,y,rad,0,Math.PI*2); tctx.fill();
  }
  // hot core near the nozzle
  const coreLen = len*.35;
  const cg = tctx.createLinearGradient(0,0,coreLen,0);
  cg.addColorStop(0,`rgba(255,255,255,${.75*flick})`);
  cg.addColorStop(1,'rgba(255,255,255,0)');
  tctx.fillStyle = cg;
  tctx.beginPath(); tctx.ellipse(coreLen/2,0,coreLen/2,4+flick*1.5,0,0,Math.PI*2); tctx.fill();
  // nozzle flare
  const fr = 12 + flick*8 + puff*10;
  const fg = tctx.createRadialGradient(0,0,0,0,0,fr);
  fg.addColorStop(0,`rgba(255,255,255,${.85*flick})`);
  fg.addColorStop(.4,`rgba(${r},${g},${b},${.45*flick})`);
  fg.addColorStop(1,`rgba(${r},${g},${b},0)`);
  tctx.fillStyle = fg;
  tctx.beginPath(); tctx.arc(0,0,fr,0,Math.PI*2); tctx.fill();
}
let lastThr = 0;
(function loop(now){
  if (document.getElementById('home').classList.contains('active') && now-lastThr > 33){ drawThruster(); lastThr = now; }  // ~30fps flicker
  requestAnimationFrame(loop);
})(0);

const sweepRafs = new Map();
function sweepImage(img, cv, durSec){
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, band = Math.max(W,H)*0.45;
  const dur = durSec*1000, t0 = performance.now();

    const y = -band + e*(H+band*2);                 // band travels top-left → bottom-right
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    ctx.globalCompositeOperation = 'source-in';

}

/* water ripple: shift each row of the water area sideways with a moving sine, then keep only the water (mask) */
let rippleRaf, rippleSec = null;
const rippleMasks = {};
document.querySelectorAll('canvas.ripple').forEach(cv=>{
  const m = new Image(); m.src = cv.dataset.mask; rippleMasks[cv.dataset.mask] = m;
});
function rippleLoop(now){
  rippleRaf = requestAnimationFrame(rippleLoop);
  if (!rippleSec || now - (rippleLoop.last||0) < 33) return;    // ~30fps
  rippleLoop.last = now;
  const t = now/1000*CONFIG.rippleSpeed;
  rippleSec.querySelectorAll('canvas.ripple').forEach(cv=>{
    const src = rippleSec.querySelector('img.city-src');
    const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
    const sx0 = +cv.dataset.x, sy0 = +cv.dataset.y, step = 2;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0,0,W,H);
    for (let y=0; y<H; y+=step){
      const p = y/H;                                       // 0 = far bank, 1 = near bank
      const amp = CONFIG.rippleAmp*(.25 + .75*p);
      const k = .55 - .3*p;                                // far waves are tighter
      const dx = amp*Math.sin(y*k - t*2.2) + amp*.45*Math.sin(y*k*2.7 + t*3.1);
      const dy = Math.sin(y*k*.6 - t*1.3)*.6*p;
      ctx.drawImage(src, sx0 - dx, sy0 + y + dy, W, step, 0, y, W, step);
    }
    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(rippleMasks[cv.dataset.mask],0,0,W,H);
  });
  rippleSec.querySelectorAll('canvas.falls').forEach(cv=>drawFalls(cv, now/1000));
  rippleSec.querySelectorAll('canvas.turbines').forEach(cv=>drawTurbines(cv, now/1000));
  rippleSec.querySelectorAll('canvas.chargers').forEach(cv=>drawChargers(cv, now/1000));
  rippleSec.querySelectorAll('canvas.fx').forEach(cv=>drawFX(cv, now/1000));
  rippleSec.querySelectorAll('canvas.mist').forEach(cv=>drawMist(cv, now/1000));
}

/* waterfall: scrolling streak texture, sheared to the fall's slope, kept inside the white-water mask, plus foam at the base */
const fallTex = (()=>{
  const c = document.createElement('canvas'); c.width = 320; c.height = 240;
  const x = c.getContext('2d');
  for (let i=0;i<140;i++){
    const px = Math.random()*c.width, py = Math.random()*c.height;
    const len = 18 + Math.random()*60, w = .8 + Math.random()*2;
    const light = Math.random() < .55;
    const a = light ? .35 + Math.random()*.45 : .12 + Math.random()*.2;
    const col = light ? '255,255,255' : '90,125,160';
    for (const dy of [0, -c.height]){                // draw twice so the tile wraps vertically
      const g = x.createLinearGradient(0,py+dy,0,py+dy+len);
      g.addColorStop(0,`rgba(${col},0)`); g.addColorStop(.5,`rgba(${col},${a})`); g.addColorStop(1,`rgba(${col},0)`);
      x.fillStyle = g; x.fillRect(px, py+dy, w, len);
    }
  }
  return c;
})();
const fallMasks = {};
document.querySelectorAll('canvas.falls').forEach(cv=>{ const m = new Image(); m.src = cv.dataset.mask; fallMasks[cv.dataset.mask] = m; });
function drawFalls(cv, t){
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, TH = fallTex.height;
  const off = (t*CONFIG.fallSpeed) % TH;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0,0,W,H);
  ctx.setTransform(1,0,+(cv.dataset.shear||-.37),1,40,0);   // lean the streaks like the falls
  ctx.drawImage(fallTex,-40,off-TH); ctx.drawImage(fallTex,-40,off);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = 'destination-in';
  ctx.drawImage(fallMasks[cv.dataset.mask],0,0,W,H);
  // foam / mist along the base of the falls
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0;i<7;i++){
    const bx = W*.11 + i*W*.105 + Math.sin(t*1.7+i)*3, by = +(cv.dataset.foamy||90) + (i%2)*4 + Math.sin(t*2.3+i*1.9)*2;
    const r = 11 + Math.sin(t*3.1+i*2.2)*3 + Math.random()*2;
    const a = .16 + .08*Math.sin(t*4+i) + Math.random()*.05;
    const g = ctx.createRadialGradient(bx,by,0,bx,by,r);
    g.addColorStop(0,`rgba(255,255,255,${a})`); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
  }
}

/* wind turbines: original blades were removed from the photo; new ones are drawn here and rotate */
function drawTurbines(cv, t){
  const ctx = cv.getContext('2d'), S = cv.width/parseFloat(cv.style.width);
  const ox = +cv.dataset.x, oy = +cv.dataset.y;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  TURBINES[cv.dataset.set].forEach((tb,i)=>{
    const speed = CONFIG.turbineRPM/60*Math.PI*2*(.85 + (i*37%10)/40);
    const ang = t*speed + i*1.3;
    ctx.setTransform(S*(tb.sx ?? tb.squash),0,0,S*(tb.sy ?? 1),(tb.x-ox)*S,(tb.y-oy)*S);
    for (let b=0;b<3;b++){
      const a = ang + b*Math.PI*2/3;
      ctx.save(); ctx.rotate(a);
      const L = tb.len, w = Math.max(1.6, L*.075);
      ctx.beginPath();                               // tapered, slightly curved blade pointing up
      ctx.moveTo(-w*.5,0);
      ctx.quadraticCurveTo(-w*.9,-L*.35,-.35,-L);
      ctx.lineTo(.35,-L);
      ctx.quadraticCurveTo(w*.4,-L*.4,w*.5,0);
      ctx.closePath();
      ctx.fillStyle = tb.fill || 'rgba(246,248,250,.97)'; ctx.fill();
      ctx.lineWidth = .5; ctx.strokeStyle = tb.stroke || 'rgba(120,135,155,.55)'; ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath(); ctx.ellipse(0,0,Math.max(1.8,tb.len*.07),Math.max(1.6,tb.len*.06),0,0,Math.PI*2);
    ctx.fillStyle = tb.fill || '#f2f4f6'; ctx.fill(); ctx.lineWidth=.5; ctx.strokeStyle = tb.stroke || 'rgba(120,135,155,.6)'; ctx.stroke();
  });
}

/* ---------- shared drawing helpers for the data-style effects ---------- */
function ping(ctx, x, y, t, period, rgb, maxR, phase=0){
  for (const off of [0, .5]){                         // two rings, half a cycle apart
    const p = (((t+phase)/period + off) % 1);
    const r = 5 + p*maxR, a = (1-p)*(1-p)*.9;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.lineWidth = 2.5; ctx.strokeStyle = `rgba(${rgb},${a})`; ctx.stroke();
  }
}
function pathLen(pts){ let L=0; for(let i=1;i<pts.length;i++) L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); return L; }
function pointAt(pts, s){
  let d = s*pathLen(pts);
  for (let i=1;i<pts.length;i++){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i], seg=Math.hypot(x1-x0,y1-y0);
    if (d<=seg){ const k=d/seg; return [x0+(x1-x0)*k, y0+(y1-y0)*k]; }
    d -= seg;
  }
  return pts[pts.length-1];
}
function comet(ctx, pts, s, rgb, size){
  for (let k=14;k>=0;k--){                            // trail first, head last
    const ss = s - k*.012; if (ss<0) continue;
    const [x,y] = pointAt(pts, ss);
    const r = size*(1-k/16), a = (1-k/15)*.85;
    const g = ctx.createRadialGradient(x,y,0,x,y,r*2.2);
    g.addColorStop(0,`rgba(255,255,255,${a})`); g.addColorStop(.35,`rgba(${rgb},${a*.7})`); g.addColorStop(1,`rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r*2.2,0,Math.PI*2); ctx.fill();
  }
}
function quadScan(ctx, q, p, rgb){                    // light band crossing a floating panel, left → right
  const xs = q.map(v=>v[0]), x0 = Math.min(...xs), x1 = Math.max(...xs), w = x1-x0;
  const x = x0 - w*.25 + p*w*1.5, bw = w*.22;
  ctx.save();
  ctx.beginPath(); q.forEach(([px,py],i)=> i?ctx.lineTo(px,py):ctx.moveTo(px,py)); ctx.closePath(); ctx.clip();
  const g = ctx.createLinearGradient(x-bw,0,x+bw,0);
  g.addColorStop(0,`rgba(${rgb},0)`); g.addColorStop(.5,`rgba(${rgb},.38)`); g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x0,0,w,2000);
  ctx.restore();

const FX = {
  aisolar(ctx, t){

    const A=[482,550], Lb=[505,700], Rb=[610,660], lerp=(p,q,s)=>[p[0]+(q[0]-p[0])*s, p[1]+(q[1]-p[1])*s];
    for (let k=0;k<3;k++){
      const s = ((t/2.4) + k/3) % 1, s2 = Math.min(1, s+.07);
      const pts = [lerp(A,Lb,s), lerp(A,Rb,s), lerp(A,Rb,s2), lerp(A,Lb,s2)];
      ctx.beginPath(); pts.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath();
      ctx.fillStyle = `rgba(170,235,255,${.55*(1-s)})`; ctx.fill();
    }
    // 2) map hotspots ping like radar
    [[606,676],[702,708],[685,800],[875,836],[857,940]].forEach(([x,y],i)=>ping(ctx,x,y,t,2.2,'255,190,70',26,i*.45));
    [[565,735],[732,762],[638,841],[784,884]].forEach(([x,y],i)=>ping(ctx,x,y,t,2.6,'120,220,255',20,i*.6+.3));

    const bx0=1004,bx1=1655,by0=627,by1=878, p=(t/3.6)%1, y=by0+p*(by1-by0);
    ctx.save(); ctx.beginPath(); ctx.rect(bx0,by0,bx1-bx0,by1-by0); ctx.clip();
    const g = ctx.createLinearGradient(0,y-60,0,y);
    g.addColorStop(0,'rgba(255,215,110,0)'); g.addColorStop(1,'rgba(255,215,110,.32)');

function drawMist(cv, t){

/* EV charger screens: charge level rising + soft pulse */
function drawChargers(cv, t){
  const ctx = cv.getContext('2d'), S = cv.width/parseFloat(cv.style.width);
  const ox = +cv.dataset.x, oy = +cv.dataset.y;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(S,0,0,S,-ox*S,-oy*S);
  ctx.globalCompositeOperation = 'lighter';
  CHARGERS[cv.dataset.set].forEach((c,i)=>{
    const cycle = 3.2, p = ((t + i*.8) % cycle)/cycle;           // 0..1 fill progress
    const fillH = c.h*Math.min(1, p*1.15);
    const pulse = .5 + .5*Math.sin(t*3 + i);
    const r = Math.min(3, c.w/3);
    ctx.save();
    ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, r); ctx.clip();
    ctx.fillStyle = `rgba(60,200,255,${.10 + .12*pulse})`;          // screen glow
    ctx.fillRect(c.x, c.y, c.w, c.h);
    const g = ctx.createLinearGradient(0, c.y+c.h-fillH, 0, c.y+c.h);
    g.addColorStop(0, `rgba(170,255,240,${p<.87 ? .85 : .85*(1-(p-.87)/.13)})`);
    g.addColorStop(.15,'rgba(60,220,200,.45)');
    g.addColorStop(1,  'rgba(40,180,220,.25)');
    ctx.fillStyle = g; ctx.fillRect(c.x, c.y+c.h-fillH, c.w, fillH);
    ctx.restore();
  });
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   SOUND — all synthesized with Web Audio (no audio files, works offline)
   Theme: technology + space. Each page adds its own nature/energy layer.
   ========================================================= */
const Sound = (()=>{
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || !CONFIG.sound) return { scene(){}, click(){}, whoosh(){}, intro(){} };
  const ctx = new AC();
  const master = ctx.createGain(); master.gain.value = CONFIG.masterVolume; master.connect(ctx.destination);
  const ambBus = ctx.createGain(); ambBus.gain.value = CONFIG.ambienceVolume; ambBus.connect(master);
  const sfxBus = ctx.createGain(); sfxBus.gain.value = CONFIG.sfxVolume; sfxBus.connect(master);
  // space echo shared by blips and pings
  const echo = ctx.createDelay(1); echo.delayTime.value = .38;
  const fb = ctx.createGain(); fb.gain.value = .38;
  const echoLP = ctx.createBiquadFilter(); echoLP.type='lowpass'; echoLP.frequency.value = 2800;
  echo.connect(echoLP); echoLP.connect(fb); fb.connect(echo);
  const echoOut = ctx.createGain(); echoOut.gain.value = .55; echoLP.connect(echoOut); echoOut.connect(master);

  // noise buffers
  const len = ctx.sampleRate*4;
  const white = ctx.createBuffer(1,len,ctx.sampleRate), brown = ctx.createBuffer(1,len,ctx.sampleRate);
  { const w = white.getChannelData(0), b = brown.getChannelData(0); let last = 0;
    for (let i=0;i<len;i++){ w[i] = Math.random()*2-1; last = (last + .02*w[i])/1.02; b[i] = last*3.5; } }
  const noise = (buf)=>{ const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
  const lfo = (freq, depth, target)=>{ const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = freq; g.gain.value = depth; o.connect(g); g.connect(target); o.start(); return o; };
  const layer = ()=>{ const g = ctx.createGain(); g.gain.value = 0; g.connect(ambBus); return g; };

  const L = {};
  // space pad: low detuned drone with a slowly breathing filter
  { L.pad = layer();
    const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 520; f.Q.value = 2; f.connect(L.pad);
    lfo(.05, 260, f.frequency);
    [[55,'sawtooth',.16],[55.4,'sawtooth',.16],[82.4,'sawtooth',.10],[110.2,'triangle',.12],[164.8,'sine',.05]].forEach(([fr,type,v])=>{
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = fr; g.gain.value = v; o.connect(g); g.connect(f); o.start();
    });
  }
  // cosmic wind: very soft airy noise
  { L.space = layer();
    const f = ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value = 900; f.Q.value = .7; f.connect(L.space);
    noise(white).connect(f); lfo(.07, 500, f.frequency);
  }
  // waterfall: deep rumble + spray
  { L.fall = layer();
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1100; lp.connect(L.fall);
    noise(brown).connect(lp);
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 3200; bp.Q.value = .6;
    const sg = ctx.createGain(); sg.gain.value = .08; noise(white).connect(bp); bp.connect(sg); sg.connect(L.fall);
  }
  // wind gusts (centre frequency and level wander)
  { L.wind = layer();
    const f = ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value = 500; f.Q.value = 1.1;
    const g = ctx.createGain(); g.gain.value = .6; noise(white).connect(f); f.connect(g); g.connect(L.wind);
    setInterval(()=>{ const t = ctx.currentTime;
      f.frequency.setTargetAtTime(280 + Math.random()*650, t, 1.2);
      g.gain.setTargetAtTime(.25 + Math.random()*.75, t, 1.5); }, 1600);
  }
  // water lapping
  { L.water = layer();
    const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 700;
    const g = ctx.createGain(); g.gain.value = .5; noise(brown).connect(f); f.connect(g); g.connect(L.water);
    lfo(.28, .35, g.gain); lfo(.11, 200, f.frequency);
  }
  // electric hum (50 Hz grid) with a gentle buzz
  { L.hum = layer();
    const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 420; f.connect(L.hum);
    [[100,'sine',.5],[150,'sine',.18],[200,'sawtooth',.06],[300,'sine',.05]].forEach(([fr,type,v])=>{
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = fr; g.gain.value = v; o.connect(g); g.connect(f); o.start();
    });
  }

  // one-shot helpers
  function tone(freq, dur, {type='sine', vol=.2, to=null, attack=.005, bus=sfxBus, send=0}={}){
    if (ctx.state !== 'running') return;          // never queue sounds while audio is still locked
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t+dur*.8);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+attack); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(bus);
    if (send){ const s = ctx.createGain(); s.gain.value = send; g.connect(s); s.connect(echo); }
    o.start(t); o.stop(t+dur+.05);
  }
  function burst(dur, {freq=2000, q=1, vol=.2, type='bandpass', sweepTo=null, bus=sfxBus}={}){
    if (ctx.state !== 'running') return;
    const t = ctx.currentTime, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = white; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol, t+dur*.35); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(bus); s.start(t, Math.random()*3); s.stop(t+dur+.05);
  }
  const PENTA = [880, 987.8, 1174.7, 1318.5, 1568, 1760, 1975.5];

  // page → ambience mix (0..1 per layer)
  const MIX = {
    home:    {pad:1,   space:.55},
    who:     {pad:.55, space:.2,  water:.8, wind:.25},
    growth:  {pad:.5,  fall:.75, wind:.45, hum:.35},
    smart:   {pad:.5,  fall:.6,  wind:.5,  water:.45},
    ev:      {pad:.55, hum:.4,   space:.2},
    aisolar: {pad:.65, space:.35},
    biomass: {pad:.55, wind:.4,  space:.25},
    insar:   {pad:.55, water:.55, space:.25},
  };
  // page → recurring electronic details
  const DETAIL = {
    home:    ()=> tone(PENTA[Math.random()*PENTA.length|0], 1.6, {vol:.05, attack:.01, bus:ambBus, send:.6}),
    ev:      ()=>{ tone(1800+Math.random()*900, .06, {type:'square', vol:.02, bus:ambBus, send:.4}); if (Math.random()<.35) burst(.04,{freq:5000, type:'highpass', vol:.05, bus:ambBus}); },
    aisolar: ()=> tone(2000+Math.random()*1600, .05, {type:'sine', vol:.035, bus:ambBus, send:.5}),
    biomass: ()=> tone(1500+Math.random()*1500, .05, {type:'sine', vol:.03, bus:ambBus, send:.5}),
    insar:   ()=> tone(1700+Math.random()*1200, .05, {type:'sine', vol:.03, bus:ambBus, send:.5}),
    growth:  ()=>{ if (Math.random()<.5) burst(.035,{freq:4500, type:'highpass', vol:.035, bus:ambBus}); },
  };
  const PING = { aisolar:2.2, insar:1.9 };     // sonar pings in step with the map pins
  let current = null, detailTimer, pingTimer;
  // background music: music.mp3 next to index.html. Missing file → ambience only.
  const music = new Audio();
  let musicOK = false;
  music.loop = true; music.preload = 'auto';
  music.addEventListener('canplay', ()=>{ if (!musicOK){ musicOK = true; applyVolumes(); remix(); tryMusic(); } });
  music.addEventListener('error', ()=>{ musicOK = false; remix(); });
  // the desktop app passes the location of a music.mp3 placed next to the .exe
  music.src = new URLSearchParams(location.search).get('music') || 'music.mp3';
  function tryMusic(){ if (musicOK && music.paused && vol.music > 0) music.play().catch(()=>{}); }

  const vol = { master:CONFIG.masterVolume, music:CONFIG.musicVolume, ambience:CONFIG.ambienceVolume, sfx:CONFIG.sfxVolume };
  function applyVolumes(){
    const t = ctx.currentTime;
    master.gain.setTargetAtTime(vol.master, t, .05);
    ambBus.gain.setTargetAtTime(vol.ambience, t, .05);
    sfxBus.gain.setTargetAtTime(vol.sfx, t, .05);
    music.volume = Math.max(0, Math.min(1, vol.master*vol.music));
    if (vol.music <= 0) music.pause(); else tryMusic();
  }

  // crossfade to the page's mix: every layer ramps linearly to its target and is silent within 1.2 s
  function remix(){
    const mix = MIX[current] || MIX.home, t = ctx.currentTime, playingMusic = musicOK && vol.music > 0;
    Object.keys(L).forEach(k=>{
      let target = mix[k] || 0;
      if (k === 'pad' && playingMusic) target = 0;   // the music replaces the space drone
      const g = L[k].gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(target, t + 1.2);
    });
  }
  function scene(id){
    current = id;
    remix();
    clearTimeout(detailTimer); clearInterval(pingTimer);
    if (DETAIL[id]){
      const next = ()=>{ detailTimer = setTimeout(()=>{ if (current===id){ DETAIL[id](); next(); } }, id==='home' ? 2200+Math.random()*3500 : 500+Math.random()*1600); };
      next();
    }
    if (PING[id]) pingTimer = setInterval(()=> tone(id==='insar'?880:1046.5, 1.1, {vol:.05, attack:.004, bus:ambBus, send:.7}), PING[id]*1000);
  }
  return {
    scene,
    click(isHome){ ctx.resume().then(()=>{           // menu tap / home tap
      if (isHome){ tone(1400, .12, {to:700, vol:.16, send:.3}); tone(2100, .08, {vol:.05}); }
      else { tone(900, .1, {to:1900, vol:.16, send:.35}); tone(2600, .07, {vol:.06, attack:.002}); }
    }); },
    whoosh(){                                      // page transition
      burst(.75, {freq:350, sweepTo:3800, q:1.4, vol:.22});
      tone(220, .7, {to:70, vol:.12, type:'sine'});
      setTimeout(()=> tone(1760, 1.2, {vol:.04, send:.6}), 320);
    },
    intro(){                                       // home intro swell
      burst(2.2, {freq:200, sweepTo:2400, q:.8, vol:.12});
      [440,659.3,880].forEach((f,i)=> setTimeout(()=> tone(f, 2.4, {vol:.05, attack:.4, send:.5}), 300+i*350));
    },
    unlock(){ if (ctx.state !== 'running') ctx.resume(); tryMusic(); },
    setVolumes(v){ Object.assign(vol, v); applyVolumes(); remix(); },
    get volumes(){ return {...vol}; },
    get musicFound(){ return musicOK; },
    test(kind){ ctx.resume().then(()=>{ if (kind==='sfx') this.click(false); else if (kind==='ambience') this.intro(); }); },
    suspend(){ ctx.suspend(); music.pause(); },
    resume(){ ctx.resume(); tryMusic(); },
    _layers: L,
    _ctx: ctx, _master: master,   // for diagnostics
  };
})();
['pointerdown','keydown'].forEach(ev=> addEventListener(ev, ()=>Sound.unlock && Sound.unlock(), {capture:true}));
// phones/tablets: stop all sound when the page is hidden, pick up again when it comes back
document.addEventListener('visibilitychange', ()=>{ if (!Sound.suspend) return; document.hidden ? Sound.suspend() : Sound.resume(); });

/* =========================================================
   HIDDEN CORNERS (for staff)
   - tap top-left corner 5 times  → Settings (volumes, idle times)
   - tap top-right corner 5 times → Quit
   ========================================================= */
const SETTINGS_KEY = 'egat-kiosk-settings';
function loadSettings(){
  try{
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
    if (s){ ['masterVolume','musicVolume','ambienceVolume','sfxVolume','idleSeconds','homeReplaySeconds'].forEach(k=>{ if (typeof s[k]==='number') CONFIG[k]=s[k]; }); }
  }catch(e){}
  Sound.setVolumes && Sound.setVolumes({ master:CONFIG.masterVolume, music:CONFIG.musicVolume, ambience:CONFIG.ambienceVolume, sfx:CONFIG.sfxVolume });
}
function saveSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify({ masterVolume:CONFIG.masterVolume, musicVolume:CONFIG.musicVolume, ambienceVolume:CONFIG.ambienceVolume, sfxVolume:CONFIG.sfxVolume, idleSeconds:CONFIG.idleSeconds, homeReplaySeconds:CONFIG.homeReplaySeconds })); }catch(e){}
}
loadSettings();

const settingsEl = document.getElementById('settings'), quitEl = document.getElementById('quit');
let adminOpen = false;
const SLIDERS = [['masterVolume','master'],['musicVolume','music'],['ambienceVolume','ambience'],['sfxVolume','sfx']];
function renderSettings(){
  SLIDERS.forEach(([k])=>{
    const v = Math.round(CONFIG[k]*100);
    document.getElementById('s-'+k).value = v;
    document.getElementById('v-'+k).textContent = v;
  });
  document.getElementById('v-idleSeconds').textContent = Math.round(CONFIG.idleSeconds/60);
  document.getElementById('v-homeReplaySeconds').textContent = Math.round(CONFIG.homeReplaySeconds/60);
  const found = Sound.musicFound;
  const st = document.getElementById('musicStatus');
  st.textContent = found ? 'พบไฟล์ music.mp3 — กำลังเล่นเพลง' : 'ไม่พบไฟล์ music.mp3 — เล่นเฉพาะเสียงบรรยากาศ';
  st.dataset.ok = found ? '1' : '0';
}
SLIDERS.forEach(([k,bus])=>{
  const el = document.getElementById('s-'+k);
  el.addEventListener('input', ()=>{
    CONFIG[k] = el.value/100;
    document.getElementById('v-'+k).textContent = el.value;
    Sound.setVolumes && Sound.setVolumes({[bus]: CONFIG[k]});
  });
  el.addEventListener('change', ()=>{ saveSettings(); if (k==='sfxVolume') Sound.test && Sound.test('sfx'); });
});
document.querySelectorAll('[data-step]').forEach(b=> b.addEventListener('click', ()=>{
  const k = b.dataset.step, d = +b.dataset.d;
  const min = Math.max(1, Math.min(30, Math.round(CONFIG[k]/60) + d));
  CONFIG[k] = min*60; saveSettings(); renderSettings();
  Sound.test && Sound.test('sfx');
}));
document.querySelectorAll('[data-vol]').forEach(b=> b.addEventListener('click', ()=>{
  const k = b.dataset.vol, el = document.getElementById('s-'+k);
  el.value = Math.max(0, Math.min(100, +el.value + +b.dataset.d));
  el.dispatchEvent(new Event('input')); el.dispatchEvent(new Event('change'));
}));
document.getElementById('testAmb').addEventListener('click', ()=> Sound.test && Sound.test('ambience'));
document.getElementById('settingsClose').addEventListener('click', ()=>{ settingsEl.hidden = true; adminOpen = false; lastTouch = Date.now(); });
document.getElementById('quitCancel').addEventListener('click', ()=>{ quitEl.hidden = true; adminOpen = false; lastTouch = Date.now(); });
document.getElementById('quitOk').addEventListener('click', ()=>{
  Sound.suspend && Sound.suspend();
  if (window.kioskApp) { window.kioskApp.quit(); return; }   // desktop app (.exe)
  window.close();
  setTimeout(()=>{ document.getElementById('quitHelp').hidden = false; }, 400);   // the browser refused to close this window
});
function openSettings(){ renderSettings(); quitEl.hidden = true; settingsEl.hidden = false; adminOpen = true; }
function openQuit(){ settingsEl.hidden = true; document.getElementById('quitHelp').hidden = true; quitEl.hidden = false; adminOpen = true; }

const cornerTaps = { tl:[], tr:[] };
stage.addEventListener('pointerdown', e=>{
  if (adminOpen) return;
  const r = stage.getBoundingClientRect(), s = r.width/1920;
  const x = (e.clientX - r.left)/s, y = (e.clientY - r.top)/s;
  const corner = (x < 160 && y < 160) ? 'tl' : (x > 1760 && y < 52) || (x > 1872 && y < 160) ? 'tr' : null;
  if (!corner){ cornerTaps.tl.length = cornerTaps.tr.length = 0; return; }
  const now = performance.now(), list = cornerTaps[corner];
  list.push(now);
  while (list.length && now - list[0] > 3000) list.shift();     // 5 taps within 3 seconds
  if (list.length >= 5){ list.length = 0; corner === 'tl' ? openSettings() : openQuit(); }
}, true);

/* ---------- idle timer ----------
   - on a content page: no touch for CONFIG.idleSeconds → back to Home
   - on Home: no touch for CONFIG.homeReplaySeconds → replay the Home intro animation */
let currentId = 'home', lastTouch = Date.now();
addEventListener('pointerdown', ()=>{ lastTouch = Date.now(); }, true);
setInterval(()=>{
  if (adminOpen){ lastTouch = Date.now(); return; }   // never time out while staff panels are open
  const idle = (Date.now() - lastTouch)/1000;
  if (currentId !== 'home' && idle >= CONFIG.idleSeconds){
    lastTouch = Date.now();
    show('home');
  } else if (currentId === 'home' && idle >= CONFIG.homeReplaySeconds && !busy){
    lastTouch = Date.now();
    fader.classList.add('on');                          // short fade to black, then replay
    setTimeout(()=>{ playHome(); fader.classList.remove('on'); }, 400);
  }
}, 1000);

/* ---------- preload everything, then start ---------- */
Promise.all([...document.images].map(img=>img.decode().catch(()=>{}))).then(()=>{
  home.classList.add('active');
  playHome();
});
</script>
</body>
</html>
